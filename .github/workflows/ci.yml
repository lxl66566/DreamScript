name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      # All-features everywhere: ds-rt/ds-vm carry a diag feature, and the
      # workspace gate is `cargo nextest run --workspace --all-features`.
      # `--all-targets` is deliberately absent from nextest here: it pulls
      # the harness=false benches (ds-check check_perf, ds-vm vm) into the
      # test listing, which nextest cannot list (exit 104).
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --workspace --all-features
      - run: cargo nextest run -p ds-rt

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Warnings surfaced, not denied: the doc tree still carries ~250 broken
      # intra-doc link warnings (single-token bracket refs like [C4] in doc
      # comments). Flip to RUSTDOCFLAGS: "-D warnings" once those are swept.
      - run: cargo doc --workspace --no-deps

  bench-goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Release CLI only (timings never run here); the check compares each
      # kernel's final `result:` line across ds, python, and node (lua SKIPs
      # when absent) and exits nonzero on any golden mismatch.
      - run: cargo build --release -p ds-cli
      - run: bash benchmarks/run.sh check
        env:
          DS_BIN: ${{ github.workspace }}/target/release/ds
