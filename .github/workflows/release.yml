name: rust release action

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      # The release build rides the runner's stable toolchain; gate the tag on
      # the same channel, since local checks ride nightly and its borrow
      # checker accepts code that stable rejects.
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.os == 'ubuntu-latest'
      - run: cargo check --locked -p ds-cli
        if: matrix.os == 'ubuntu-latest'
      - name: release rust project
        uses: lxl66566/rust-simple-release@main
        with:
          # unset, the action builds the first workspace package, which is
          # ds-abi (a lib) under the crates/* glob, not the ds binary
          package: ds-cli
          files_to_pack: README.md,LICENSE-MIT,LICENSE-APACHE
          targets: |
            aarch64-unknown-linux-gnu
            aarch64-unknown-linux-musl
            aarch64-pc-windows-msvc
            x86_64-pc-windows-msvc
            x86_64-unknown-linux-musl
            x86_64-unknown-linux-gnu
            aarch64-apple-darwin
            x86_64-apple-darwin
