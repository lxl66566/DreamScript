[package]
name         = "ds-cli"
description  = "The ds binary: DreamScript's command-line interface (check, run, build, fmt)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
readme.workspace       = true

[[bin]]
name = "ds"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace    = true
clap.workspace      = true
ds-check.workspace  = true
ds-diag             = { workspace = true, features = ["json"] }
ds-query.workspace  = true
ds-stdlib.workspace = true
ds-mod.workspace    = true
ds-vm.workspace     = true
ds-lower = { path = "../ds-lower" }
ds-parse = { path = "../ds-parse" }
ds-fmt   = { path = "../ds-fmt" }
