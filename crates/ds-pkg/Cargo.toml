[package]
name                   = "ds-pkg"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "DreamScript package manifests, content-addressed bundles, and minimal-version-set resolution"
readme.workspace       = true
repository.workspace   = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true

[[bench]]
harness = false
name    = "probe"

[dependencies]
blake3.workspace    = true
ds-diag             = { path = "../ds-diag" }
ds-mod              = { path = "../ds-mod" }
# the atomic install's temp-plus-rename write
tempfile.workspace  = true
thiserror.workspace = true

[dev-dependencies]
# the probe bench times the cache-probe shape over the provider seam
criterion.workspace = true
# the load-walk composition test drives ds-vm's deps-first walk
ds-vm.workspace     = true

[lints]
workspace = true
