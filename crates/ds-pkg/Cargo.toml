[package]
name         = "ds-pkg"
description  = "DreamScript package manifests, content-addressed bundles, and minimal-version-set resolution"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
readme.workspace       = true

[lints]
workspace = true

[dependencies]
blake3.workspace    = true
thiserror.workspace = true
# the atomic install's temp-plus-rename write
tempfile.workspace  = true
ds-diag = { path = "../ds-diag" }
ds-mod  = { path = "../ds-mod" }

[dev-dependencies]
# the load-walk composition test drives ds-vm's deps-first walk
ds-vm.workspace = true
