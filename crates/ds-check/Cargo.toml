[package]
name         = "ds-check"
description  = "Set-theoretic type algebra over nominal atoms for DreamScript"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
readme.workspace       = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
ds-diag = { path = "../ds-diag" }
ds-parse = { path = "../ds-parse" }
rustc-hash = "2"

[dev-dependencies]
ds-stdlib.workspace = true
# the fuzz mirrors render `render::to_json`
ds-diag             = { path = "../ds-diag", features = ["json"] }

[[bench]]
name    = "check_perf"
harness = false
