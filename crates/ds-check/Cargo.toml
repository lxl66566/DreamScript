[package]
name                   = "ds-check"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "Set-theoretic type algebra over nominal atoms for DreamScript"
readme.workspace       = true
repository.workspace   = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true

[[bench]]
harness = false
name    = "check_perf"

[dependencies]
ds-diag             = { path = "../ds-diag" }
ds-parse            = { path = "../ds-parse" }
rustc-hash          = "2"
thiserror.workspace = true

[dev-dependencies]
ds-corpus-path.workspace = true
# the fuzz mirrors render `render::to_json`
ds-diag                  = { path = "../ds-diag", features = ["json"] }
ds-stdlib.workspace      = true

[lints]
workspace = true
