[package]
name         = "ds-query"
description  = "Memoized query engine with block-grain invalidation: the single path to compiler data for every DreamScript consumer"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
readme.workspace       = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
# The engine's internal maps are keyed by small integer-packed keys: the
# hasher is the whole cost, so the std SipHash is the wrong default.
rustc-hash = "2"
ds-diag = { path = "../ds-diag" }
ds-parse = { path = "../ds-parse" }
ds-check = { path = "../ds-check" }
# the derive expansion the `expanded` query serves
ds-meta  = { path = "../ds-meta" }
# the ambient member's precompiled parse tree: the parse compute serves it
# from the embedded blob, the fresh parse as the fallback
ds-stdlib = { workspace = true, features = ["ast-serde"] }

[[bench]]
name    = "query_loop"
harness = false
