[package]
name         = "ds-stdlib"
description  = "The DreamScript stdlib ambient: the checked-declaration layer a ds check package registers before user sources"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
readme.workspace       = true

[lints]
workspace = true

[features]
# The precompiled ambient AST blob's decode path: postcard over ds-parse's
# serde surface, the source hash through ds-mod. Off by default so
# consumers that never load the blob carry no serializer.
ast-serde = ["dep:postcard", "dep:ds-mod", "ds-parse/ast-serde"]

[dependencies]
ds-check = { path = "../ds-check" }
ds-diag  = { path = "../ds-diag" }
ds-parse = { path = "../ds-parse" }
ds-mod   = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }

[dev-dependencies]
# The blob generator example and the drift gate build against this crate
# with its own feature on: the self-dependency unions the feature into
# every test and example target.
ds-stdlib = { path = ".", features = ["ast-serde"] }
