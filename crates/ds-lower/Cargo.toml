[package]
name                   = "ds-lower"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "M3 lowering: checked programs to frame layouts, uop bodies, and dsmod modules for the tier-1 VM"
readme.workspace       = true
repository.workspace   = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true

[[bench]]
harness = false
name    = "lower"

[dependencies]
ds-abi              = { path = "../ds-abi" }
ds-check            = { path = "../ds-check" }
ds-diag             = { path = "../ds-diag" }
ds-mod              = { path = "../ds-mod" }
ds-parse            = { path = "../ds-parse" }
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
# the derive-expanding analyze entries the e2e tests run raw sources through
ds-meta             = { path = "../ds-meta" }
# the ambient core source the union-element probes compose beside a user file
ds-stdlib           = { workspace = true }
ds-vm               = { path = "../ds-vm" }

[lints]
workspace = true
