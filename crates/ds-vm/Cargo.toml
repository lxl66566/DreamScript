[package]
name                   = "ds-vm"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description            = "Tier-1 VM for DreamScript: executes the ds-abi uop contract from its canonical 32-bit encoding with pooled immediates and the slot-overlay call ABI"
readme.workspace       = true
repository.workspace   = true
license.workspace      = true
keywords.workspace     = true
categories.workspace   = true

[[bench]]
harness = false
name    = "vm"

[[bench]]
harness = false
name    = "fork_join"

[[bench]]
harness = false
name    = "ledger"

[dependencies]
ds-abi                 = { path = "../ds-abi" }
# the bound externs' scalar C-ABI marshaling seam (H5)
ds-ffi                 = { path = "../ds-ffi" }
ds-mod                 = { path = "../ds-mod" }
ds-rt                  = { path = "../ds-rt" }
# the platform net face's TLS tier (the host-selected tls capability)
rustls.workspace       = true
webpki-roots.workspace = true
# the fork-join worker pool's scoped scheduler (E3's measured candidate)
youpipe.workspace      = true

[dev-dependencies]
criterion.workspace = true
# the local TLS test servers' self-signed certificates
rcgen.workspace     = true
tempfile.workspace  = true

[features]
# The RC balance tripwires: ds-rt's hard asserts on rc underflow/overflow
# (the ds-rt diag layer) arm through this feature.
diag = ["ds-rt/diag"]

[lints]
workspace = true
