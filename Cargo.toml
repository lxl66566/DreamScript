[workspace]
resolver = "3"
members  = ["crates/*"]
exclude  = ["fuzz"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.95"
readme       = "../../README.md"
repository   = "https://github.com/lxl66566/DreamScript"
license      = "MIT OR Apache-2.0"
keywords     = ["compiler", "dreamscript", "language"]
categories   = ["compilers"]

[workspace.dependencies]
anyhow         = "1"
arbitrary      = "1"
blake3         = "1"
clap           = { version = "4", features = ["derive"] }
criterion      = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
ds-check       = { path = "crates/ds-check" }
ds-comptime    = { path = "crates/ds-comptime" }
ds-corpus-path = { path = "crates/ds-corpus-path" }
ds-diag        = { path = "crates/ds-diag" }
ds-dsi         = { path = "crates/ds-dsi" }
ds-ffi         = { path = "crates/ds-ffi" }
ds-lower       = { path = "crates/ds-lower" }
ds-mod         = { path = "crates/ds-mod" }
ds-parse       = { path = "crates/ds-parse" }
ds-pkg         = { path = "crates/ds-pkg" }
ds-query       = { path = "crates/ds-query" }
ds-stdlib      = { path = "crates/ds-stdlib" }
ds-vm          = { path = "crates/ds-vm" }
gungraun       = "0.20"
libffi         = "5"
memchr         = "2"
memmap2        = "0.9"
pest           = "2"
pest_derive    = "2"
postcard       = { version = "1", default-features = false, features = ["alloc"] }
rcgen          = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustc-hash     = "2"
rustls         = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde          = { version = "1", features = ["derive"] }
sonic-rs       = "0.5"
tempfile       = "3"
thiserror      = "2"
webpki-roots   = "1"
youpipe        = { version = "0.10", default-features = false }

[workspace.lints.clippy]
all                     = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
doc_markdown            = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
pedantic                = { level = "warn", priority = -1 }
wildcard_imports        = "allow"

[workspace.lints.rust]
unsafe_code           = "allow"
unused_qualifications = "warn"

[profile.bench]
# gungraun's Callgrind pass needs symbols to attribute counts
debug = true

[profile.release]
# hot paths cross ds-vm -> ds-abi/ds-rt, so cross-crate inlining needs LTO
lto           = "thin"
codegen-units = 1
