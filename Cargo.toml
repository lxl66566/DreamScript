[workspace]
resolver   = "3"
members    = ["crates/*"]
exclude    = ["fuzz"]

[workspace.package]
version     = "0.1.0"
edition     = "2024"
rust-version = "1.85"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/lxl66566/DreamScript"
keywords    = ["dreamscript", "language", "compiler"]
categories  = ["compilers"]

[workspace.dependencies]
thiserror  = "2"
blake3     = "1"
memmap2    = "0.9"
log        = "0.4"
arbitrary  = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# default-features off: rayon/plotters only serve report generation
criterion  = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.clippy]
all                     = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
doc_markdown            = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
pedantic                = { level = "warn", priority = -1 }
wildcard_imports        = "allow"

[workspace.lints.rust]
unsafe_code           = "allow"
unused_qualifications = "warn"

[workspace.lints.cargo]
# remove once every workspace dependency is consumed by a landed crate
unused_workspace_dependencies = "allow"

[profile.release]
codegen-units = 1
