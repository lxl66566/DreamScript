[workspace]
resolver   = "3"
members    = ["crates/*"]
exclude    = ["fuzz"]

[workspace.package]
version     = "0.1.0"
edition     = "2024"
rust-version = "1.85"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/lxl66566/DreamScript"
keywords    = ["dreamscript", "language", "compiler"]
categories  = ["compilers"]
readme      = "../../README.md"

[workspace.dependencies]
thiserror  = "2"
rustc-hash = "2"
blake3     = "1"
memmap2    = "0.9"
memchr     = "2"
arbitrary  = "1"
pest       = "2"
pest_derive = "2"
serde      = { version = "1", features = ["derive"] }
# fast JSON serialization; ds-diag's `json` feature is its only consumer
sonic-rs   = "0.5"
# compact self-describing-free codec: the precompiled ambient AST blob's
# format (ds-stdlib's `ast-serde` feature); `alloc` serves to_allocvec, the
# default heapless/cobs surfaces are not used
postcard   = { version = "1", default-features = false, features = ["alloc"] }
# default-features off: rayon/plotters only serve report generation
criterion  = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# deterministic Valgrind instruction-count pinning (the arc's stage-three gate)
gungraun   = "0.19.4"
anyhow     = "1"
# the fork-join scheduler backend measurement's candidate (M5's decided-by-measurement seam);
# the tokio runtime serves async stages only, the bench uses `youpipe::scope`
youpipe    = { version = "0.8", default-features = false }
tempfile   = "3"
clap       = { version = "4", features = ["derive"] }
# in-workspace crates, so consumers write `name.workspace = true`
ds-diag    = { path = "crates/ds-diag" }
ds-parse   = { path = "crates/ds-parse" }
ds-check   = { path = "crates/ds-check" }
ds-meta    = { path = "crates/ds-meta" }
ds-lower   = { path = "crates/ds-lower" }
ds-query   = { path = "crates/ds-query" }
ds-mod     = { path = "crates/ds-mod" }
ds-pkg     = { path = "crates/ds-pkg" }
ds-vm      = { path = "crates/ds-vm" }
ds-stdlib  = { path = "crates/ds-stdlib" }
ds-dsi     = { path = "crates/ds-dsi" }
# dev-only: run-time corpus resolution for the conformance gates
ds-corpus-path = { path = "crates/ds-corpus-path" }

[workspace.lints.clippy]
all                     = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
doc_markdown            = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
pedantic                = { level = "warn", priority = -1 }
wildcard_imports        = "allow"

[workspace.lints.rust]
unsafe_code           = "allow"
unused_qualifications = "warn"

[profile.release]
codegen-units = 1
# hot paths cross ds-vm -> ds-abi/ds-rt, so cross-crate inlining needs LTO
lto           = "thin"

[profile.bench]
# gungraun's Callgrind pass needs symbols to attribute counts
debug = true
